[project]
name = "swarmscope"
version = "0.1.0"
description = "Adaptive, hierarchical observability and control for AI agent populations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "duckdb>=1.1",
  "pyyaml>=6",
  "httpx>=0.27",
  "networkx>=3.3",
  "numpy>=1.26",
  "pyarrow>=15",
  "anthropic>=1.0",
  "claude-agent-sdk>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
swarmscope = "swarmscope.cli:main"
swarmframe = "swarmscope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
