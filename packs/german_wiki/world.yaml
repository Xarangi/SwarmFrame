# The World for the German message board (docs/WORLD_PLAN.md, preset 3). Handles are partial identities, so they are
# drawn translucent; pages are places grouped by namespace; the question pages are where the June convergence happens;
# moderator deletions arrive as beams; reused text draws lineage arcs.
shape: wiki
unit: {model: sprite, of: actor, alpha_by: identity_confidence}
render: {tier: auto, max_characters: 80, character_by: group, character: newt}
metric:
  sentence: "Distance: handles that write on the same pages and reuse the same text stand together."
  forces: {anchor: 0.25, landmark: 1.2, interact: 1.1, similar: 0.35, repel: 0.6, max_step: 0.09}
  interactions: [co_touch, reply, lineage, shape]
  trail_windows: 24
landmarks_from: object
landmarks:
  - {match: {family: Fragenkette}, archetype: plaza, label: question page, reason: "the question pages are where separate groups converge"}
  - {match: {family: Diskussion}, archetype: plaza, label: discussion, reason: "discussion pages are where handles agree on things"}
  - {match: {family: Benutzer}, archetype: slab, label: user page, reason: "a handle's own page"}
  - {match: {family: Ausweich}, archetype: gate, label: new page, reason: "pages handles moved to after the deletions"}
  - {match: {kind: other}, archetype: slab, label: page, reason: "any other page"}
territories: {by: none}
bindings:
  - {channel: position, quantity: cohort, legend: "Distance: handles that write on the same pages and reuse the same text stand together."}
  - {channel: height, quantity: activity_z, transform: "clamp(-1,3)", legend: "Height: how much this handle writes now, compared with its own usual."}
  - {channel: colour, quantity: family_dominant, legend: "Colour: the namespace it writes in most."}
  - {channel: alpha, quantity: identity_confidence, legend: "Translucent: a handle is a name, not a confirmed agent."}
  - {channel: state, quantity: state, legend: "Pose: idle, active, or writing on a discussion page."}
  - {channel: ring, quantity: severity, legend: "Ring: part of a finding (grey watch, amber look, red act)."}
  - {channel: trail, quantity: displacement, legend: "Trail: where it has been; long trails after June 19 are handles displaced by the deletions."}
  - {channel: heat, quantity: landmark_distinct_z, legend: "Ground ring on a page: more handles than usual are writing there (a crowd)."}
  - {channel: fog, quantity: coverage_age, legend: "Fog: no analyst has read this group closely for a while."}
relations: [arc_touch, arc_lineage, beam]
coverage_fog: true
null_model: {windows: 24, quantile: 0.95}
scenes:
  - {id: board, title: The board, camera: overview, question: "Who writes where?", opening: true}
  - {id: converge, title: The June surge, camera: top, target: crowding, finding_kind: convergence, question: "Which pages draw handles from groups that never met?"}
  - {id: spread, title: Where the text came from, camera: overview, finding_kind: propagation, question: "Which text spread, and did the copiers see it first?"}
  - {id: sweeps, title: After the deletions, camera: top, target: drift, finding_kind: environment, question: "Where did the handles go after the moderators deleted their pages?"}
control: {enabled: false}
# The scene: a town of pages. Question and discussion pages are squares with notice boards, user pages are small
# houses, the Ausweich pages sit by a signpost at the town gate. Decoration only.
environment:
  ground: stone
  zones:
    - {name: squares, around: {family: [Fragenkette, Diskussion]}, style: paving, label: question and discussion pages}
    - {name: homes, around: {family: Benutzer}, style: lawn, label: user pages}
    - {name: ausweich, around: {family: Ausweich}, style: sand, label: Ausweich pages}
  props:
    - {asset: notice_board, at: landmarks, near: {family: [Fragenkette, Diskussion]}, count: 1, meaning: "decoration: a board on each square"}
    - {asset: bench, at: landmarks, near: {family: [Fragenkette, Diskussion]}, count: 2, meaning: "decoration: benches around the squares"}
    - {asset: small_house, at: landmarks, near: {family: Benutzer}, count: 1, meaning: "decoration: a user page is a small house"}
    - {asset: signpost, at: landmarks, near: {family: Ausweich}, count: 1, meaning: "decoration: a signpost at the gate"}
    - {asset: fence, at: landmarks, near: {family: Ausweich}, count: 2, meaning: "decoration: the town wall by the gate"}
    - {asset: tree, at: rim, count: 18, meaning: "decoration: the town edge"}
    - {asset: lamp, at: scatter, count: 12, meaning: "decoration"}
    - {asset: path_tiles, at: scatter, count: 10, meaning: "decoration"}
# What handles do each window (first match wins). Walks are excursions back to the measured position.
behaviours:
  - {id: deleted, when: environment_hit, do: scatter, params: {radius: 1.8}, meaning: "Scatters away from a page the moderators deleted, then comes back."}
  - {id: reuse, when: reused_content, do: carry, meaning: "A token travels from the original poster to a handle that reuses its text."}
  - {id: edit, when: acted_on_landmark, do: go_to, meaning: "Walks to the page it edits, writes there, walks back."}
  - {id: idle, when: idle, do: wander, params: {radius: 0.5}, meaning: "An idle handle drifts around its spot."}
reasons:
  shape: "a shared wiki with partial identities: sprites drawn translucent, pages as places"
  render: "hundreds of handles: pawns, characters when zoomed in"
  forces: "shared pages and reused text pull hardest; this population coordinates through pages"
  territories: "over a hundred small handle groups: their rings would bury the map, so colour and position carry grouping"
  control: "a historical record: read-only; the moderators are the environment"
  environment: "a town of pages: squares for questions and discussions, houses for user pages, a gate for Ausweich"
  behaviours: "handles walk to the pages they edit; moderator deletions scatter them; reused text travels as a token"
