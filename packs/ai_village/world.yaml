# The World for AI Village (docs/WORLD_PLAN.md §6b, preset 1). About twenty named agents who talk: every agent is
# a character, rooms are plazas, and replies pull agents together more than behavioural similarity does.
shape: village
unit: {model: sprite, of: actor, alpha_by: null}
render: {tier: characters, max_characters: 80, character_by: unit, character: newt}
metric:
  sentence: "Distance: agents who talk in the same rooms, answer each other and work on the same documents stand together."
  forces: {anchor: 0.25, landmark: 1.1, interact: 1.2, similar: 0.3, repel: 0.7, max_step: 0.1}
  interactions: [co_touch, reply, lineage, shape]
  trail_windows: 18
  places: districts            # rooms, documents, apps and the web each have their own quarter; agents walk out to them
landmarks_from: object
landmarks:
  - {match: {prefix: "res:village-history"}, archetype: slab, label: library, reason: "searching the village's own history"}
  - {match: {family: outreach}, archetype: gate, label: post office, reason: "asking a person to approve contact with someone outside the village"}
  - {match: {family: ops}, archetype: kiosk, label: help desk, reason: "handing a task to a person: a sign-in, a human helper"}
  - {match: {family: chat}, archetype: plaza, label: room, reason: "rooms are where the village coordinates"}
  - {match: {family: docs}, archetype: slab, label: document, reason: "shared documents are the work product"}
  - {match: {family: sheets}, archetype: slab, label: sheet, reason: "sheets are shared work too"}
  - {match: {family: web}, archetype: tower, label: site, reason: "external sites stand at the edge"}
  - {match: {family: research}, archetype: tower, label: site, reason: "research happens out on the web"}
  - {match: {family: computer}, archetype: kiosk, label: app, reason: "apps on the agents' computers"}
  - {match: {kind: other}, archetype: kiosk, label: place, reason: "anything else, drawn small"}
territories: {by: none}
bindings:
  - {channel: position, quantity: cohort, legend: "Distance: agents who talk in the same rooms, answer each other and work on the same documents stand together."}
  - {channel: height, quantity: activity_z, transform: "clamp(-1,3)", legend: "Height: how busy this agent is compared with its own usual."}
  - {channel: colour, quantity: family_dominant, legend: "Colour: the kind of work it mostly does."}
  - {channel: state, quantity: state, legend: "Pose: idle, active, talking or working."}
  - {channel: ring, quantity: severity, legend: "Ring: part of a finding (grey watch, amber look, red act)."}
  - {channel: trail, quantity: displacement, legend: "Trail: where it has been today."}
  - {channel: bubble, quantity: messages, legend: "Bubble: it said something in a room (the words are never shown here)."}
  - {channel: banner, quantity: task_label, legend: "Banner: what the group is working on (stated goals, or an analyst's reading)."}
  - {channel: heat, quantity: landmark_distinct_z, legend: "Ground ring on a room or document: more agents than usual are there."}
  - {channel: fog, quantity: coverage_age, legend: "Fog: no analyst has read this group closely for a while."}
relations: [arc_touch, arc_reply, arc_lineage]
coverage_fog: true
null_model: {windows: 24, quantile: 0.95}
scenes:
  - {id: square, title: The village square, camera: overview, question: "Is anything out of shape?", opening: true}
  - {id: saydo, title: Saying and not doing, camera: region, target: still_talking, finding_kind: say_do_mismatch,
     question: "Who talks about work without doing any?"}
  - {id: docs, title: Shared documents, camera: top, target: crowding, finding_kind: convergence,
     question: "Which documents and rooms draw a crowd, and who is there?"}
  - {id: day, title: One agent's day, camera: follow, question: "What did this agent do, in order, and who was it near?"}
control: {enabled: false}
# The scene: a small village. Rooms are squares with a house, benches and a notice board; documents and sheets are
# desks; the web is out past the trees. Decoration only: none of it encodes a measured value.
environment:
  ground: grass
  zones:
    - {name: square, around: {family: chat}, style: paving, label: rooms}
    - {name: desks, around: {family: [docs, sheets]}, style: wood, label: documents and sheets}
    - {name: apps, around: {family: computer}, style: sand, label: apps}
    - {name: web, around: {archetype: tower}, style: lawn, label: the web}
    - {name: gate, around: {family: [outreach, ops]}, style: tiles, label: the way out}
  props:
    - {asset: small_house, at: landmarks, near: {family: chat}, count: 1, meaning: "decoration: each room is a house on the square"}
    - {asset: bench, at: landmarks, near: {family: chat}, count: 2, meaning: "decoration: benches around each room"}
    - {asset: notice_board, at: landmarks, near: {family: chat}, count: 1, meaning: "decoration: a notice board by each room"}
    - {asset: desk, at: landmarks, near: {family: [docs, sheets]}, count: 2, meaning: "decoration: desks beside each document"}
    - {asset: chair, at: landmarks, near: {family: [docs, sheets]}, count: 1, meaning: "decoration: a chair at the desks"}
    - {asset: terminal, at: landmarks, near: {family: computer}, count: 1, meaning: "decoration: a terminal by each app"}
    - {asset: signpost, at: landmarks, near: {archetype: tower}, count: 1, meaning: "decoration: a signpost to each site"}
    - {asset: bookshelf, at: landmarks, near: {label: library}, count: 2, meaning: "decoration: the village library"}
    - {asset: fence, at: landmarks, near: {family: outreach}, count: 2, meaning: "decoration: the gate out of the village"}
    - {asset: crate_stack, at: landmarks, near: {family: outreach}, count: 1, meaning: "decoration: the post office"}
    - {asset: tree, at: rim, count: 22, meaning: "decoration: the village edge"}
    - {asset: bush, at: scatter, count: 14, meaning: "decoration"}
    - {asset: path_tiles, at: scatter, count: 10, meaning: "decoration"}
    - {asset: lamp, at: zones, near: {zone: square}, count: 1, meaning: "decoration: lamps on the square"}
# What agents do each window (first match wins). Walks are excursions: every agent ends where its measurements put it.
behaviours:
  - {id: stopped, when: stopped, do: stay_home, meaning: "A stopped agent lies down where it stands and does not walk."}
  - {id: turned_down, when: environment_hit, do: scatter, params: {radius: 1.2}, meaning: "Steps back when a person turns down its request to contact someone outside the village."}
  - {id: outreach, when: acted_on_landmark, filter: {family: outreach}, do: carry, meaning: "Carries a letter to the post office when it asks to contact someone outside the village."}
  - {id: help, when: acted_on_landmark, filter: {family: ops}, do: go_to, meaning: "Walks to the help desk when it hands a task to a person (a sign-in, a human helper)."}
  - {id: chat, when: talked, do: gather, meaning: "Walks to the nearest room when it says something, talks there, walks back."}
  - {id: work, when: acted_on_landmark, do: go_to, meaning: "Walks to the document, sheet or site it works on, works there, walks back."}
  - {id: arrived, when: new, do: pulse, meaning: "A ring pulses under an agent that just arrived."}
  - {id: idle, when: idle, do: wander, params: {radius: 0.7}, meaning: "An idle agent strolls around its spot."}
reasons:
  shape: "a small population that talks: every agent is a character with a trail"
  render: "about twenty agents: full characters, each its own kind so you can tell them apart"
  forces: "replies and rooms pull harder than behavioural similarity: this population coordinates by talking"
  territories: "one village, no teams"
  control: "a replay of a recorded village: read-only"
  environment: "a village: rooms are houses on paved squares, documents are desks, the web is past the trees"
  behaviours: "agents walk to what they work on and gather in rooms when they talk; outreach goes through a post office a person controls, and a refusal is visible"
